<script type="text/javascript">
Date.prototype.addDays = function (num) {
    var value = this.valueOf();
    value += 86400000 * num;
    return new Date(value);
}

function convertDate(date) {
  //https://stackoverflow.com/questions/32192922/how-do-i-get-a-date-in-yyyy-mm-dd-format
  var yyyy = date.getFullYear().toString();
  var mm = (date.getMonth()+1).toString();
  var dd  = date.getDate().toString();

  var mmChars = mm.split('');
  var ddChars = dd.split('');

  return yyyy + '-' + (mmChars[1]?mm:"0"+mmChars[0]) + '-' + (ddChars[1]?dd:"0"+ddChars[0]);
}

function deleteDate(date) {
  //https://stackoverflow.com/questions/32192922/how-do-i-get-a-date-in-yyyy-mm-dd-format

  var yyyy = date.getFullYear().toString();
  var mm = (date.getMonth()+1).toString();
  var dd  = date.getDate().toString();

  var mmChars = mm.split('');
  var ddChars = dd.split('');

  //return yyyy + '-' + (mmChars[1]?mm:"0"+mmChars[0]) + '-' + (ddChars[1]?dd:"0"+ddChars[0]);
  return (mmChars[1]?mm:"0"+mmChars[0])  + '/' + (ddChars[1]?dd:"0"+ddChars[0]) + '/' + yyyy
}

function GetICS()
{
	//https://stackoverflow.com/questions/14892422/ics-with-alert
	//Add VALARM
    cal = ics();
    cal.addEvent($('#DecomSubject').val(),$('#DecomBody').val().replaceAll('\n',' ') + " PH2: " + $('#PhaseTwo').val(), 'vSphere', $('#PhaseTwo').val(), $('#PhaseTwo').val());
	cal.download($('#PdfFileName').val())
}

$(document).ready(function() 
{	
	var todayDate=new Date();

	const queryString = window.location.search;

	// 2. Initialize the parser
	const urlParams = new URLSearchParams(queryString);

	// 3. Extract your parameters
	const sub = urlParams.get('sub');
	const bdy = urlParams.get('bdy');     
	const dt = urlParams.get('dt');   
	
	$('#DecomSubject').val(sub);
	$('#DecomBody').val(bdy);
	$('#PhaseTwo').val(dt);
	
	if ($('#PhaseTwo').val() == "") 
	{
		$('#PhaseTwo').val(deleteDate(todayDate) + ' 8:00 am');
	}
});

function UpdateBoxes()
{
	
	var todayDate=new Date();

	$('#PdfFileName').val(convertDate(todayDate));
	
}


function CopyCt() {
  /* Get the text field */
  var copyText = document.getElementById("CmdbText");

  /* Select the text field */
  copyText.select();
  copyText.setSelectionRange(0, 99999); /* For mobile devices */

  /* Copy the text inside the text field */
  document.execCommand("copy");
}

function pad(n, width, z) {
  z = z || '0';
  n = n + '';
  return n.length >= width ? n : new Array(width - n.length + 1).join(z) + n;
}

</script>
